<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Grade Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Student Grade Checker</h1>
    <div class="form-section">
      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter student name" />
      </div>
      <div class="form-group">
        <label for="studentMark">Student Mark (0 – 100)</label>
        <input type="number" id="studentMark" placeholder="Enter mark" min="0" max="100" />
      </div>
      <button id="submitBtn" onclick="submitStudent()">Submit</button>
    </div>
    <div class="result-section" id="resultArea">
      <p class="placeholder">Result will appear here after submission.</p>
    </div>
    <div class="list-section">
      <h2>All Submitted Students</h2>
      <ul id="studentList"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
